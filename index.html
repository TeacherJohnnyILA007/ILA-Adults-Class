const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let store={};try{store=JSON.parse(localStorage.getItem('bbhub')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('bbhub',JSON.stringify(store))}catch(e){}};
store.known=store.known||{};store.said=store.said||{};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DAY=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fd=d=>{const x=new Date(d+'T12:00:00');return DAY[x.getDay()]+' '+x.getDate()+' '+MON[x.getMonth()]};
const todayStr=(()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')})();
const past=LESSONS.filter(l=>l.date<=todayStr);
const latest=past[past.length-1]||LESSONS[LESSONS.length-1];
const next=SCHED.find(s=>s[1]>todayStr);
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en-GB/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t,slow){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';if(voice)u.voice=voice;u.rate=slow?.6:.9;speechSynthesis.speak(u)}catch(e){}}
const slidesBtns=l=>(l.slides||[]).map(s=>`<button class="btn" type="button" data-slides="${esc(s[1])}">&#9654; ${esc(s[0])}</button>`).join('');
function openViewer(u){$('#vframe').src=u;$('#vopen').href=u.replace('/preview','/edit');$('#viewer').hidden=false;if(location.hash!=='#slides')location.hash='slides'}
function closeViewer(){$('#viewer').hidden=true;$('#vframe').src='about:blank'}
const title=l=>`Lesson ${l.n}: ${esc(l.title)}`;

function home(){
  const l=latest;
  const pics=l.words.filter(w=>PHOTOS[w[2]]).slice(0,4).map(w=>`<img src="${PHOTOS[w[2]]}" alt="">`).join('');
  const wk=l.words.filter(w=>store.known[w[0]]).length, ps=l.phrases.filter(p=>store.said[p[0]]).length;
  const sl=(l.slides||[])[0];
  return `<div class="card hero"><div class="heroGrid"><div style="display:grid;gap:12px">
      <span class="lab">Latest lesson &middot; ${fd(l.date)}</span>
      <h1>Hello! Ready to practise?</h1><div class="vi">Xin chào! Sẵn sàng luyện tập chưa?</div>
      <div><b>Lesson ${l.n}: ${esc(l.title)}</b><div class="vi">${esc(l.unit)}${l.pages?' &middot; pages '+esc(l.pages):''}</div></div></div>
      ${pics?`<div class="mosaic">${pics}</div>`:''}</div></div>
  <div class="tiles">
    ${sl?`<button class="tile t1" type="button" data-slides="${esc(sl[1])}"><div class="ic">&#9654;&#65039;</div><b>Watch the lesson</b><span>Xem bài học (slides)</span></button>`:''}
    <a class="tile t2" href="#practice" data-set="${l.id}" data-mode="words"><div class="ic">&#128247;</div><b>Learn words</b><span>Học từ vựng &middot; ${l.words.length} words</span></a>
    <a class="tile t3" href="#practice" data-set="${l.id}" data-mode="speak"><div class="ic">&#127908;</div><b>Speak English</b><span>Luyện nói &middot; ${l.phrases.length} phrases</span></a>
  </div>
  <div class="two">
    <div class="card"><span class="lab">My progress &middot; Tiến độ</span>
      <div class="row" style="justify-content:space-between"><b>Words I know</b><span class="pill on">${wk} of ${l.words.length}</span></div><div class="bar"><i style="width:${l.words.length?wk/l.words.length*100:0}%"></i></div>
      <div class="row" style="justify-content:space-between"><b>Phrases I said</b><span class="pill on">${ps} of ${l.phrases.length}</span></div><div class="bar"><i style="width:${l.phrases.length?ps/l.phrases.length*100:0}%"></i></div></div>
    ${next?`<div class="card"><span class="lab">Next class &middot; Buổi tiếp theo</span><h3>${fd(next[1])}</h3><div><b>${esc(next[2])}</b></div><div class="note">${esc(next[3])}${next[4]?' &middot; pages '+esc(next[4]):''}. Slides appear here after class.</div></div>`:''}
  </div>
  <p class="note">Tip: add this page to your phone home screen. Tap Share, then Add to Home Screen.</p>`;
}
function lessons(){
  const done=LESSONS.slice().reverse().map(l=>`<details class="card lesson" ${l.id===latest.id?'open':''}><summary><div class="num">${l.n}</div><div style="flex:1;min-width:0"><h3>${esc(l.title)}</h3><div class="note">${fd(l.date)} &middot; ${esc(l.unit)}${l.pages?' &middot; pp. '+esc(l.pages):''}</div></div></summary>
    <div class="row">${slidesBtns(l)}${l.words.length||l.phrases.length?`<a class="btn alt" href="#practice" data-set="${l.id}">Practice English</a>`:''}</div></details>`).join('');
  const soon=SCHED.filter(s=>s[1]>todayStr).map(s=>`<div class="card soon" style="grid-template-columns:auto 1fr;align-items:center"><div class="num" style="background:var(--soft);color:var(--mute)">${s[0]}</div><div><b>${esc(s[2])}</b><div class="note">${fd(s[1])}${s[3]?' &middot; '+esc(s[3]):''}${s[4]?' &middot; pp. '+esc(s[4]):''}</div></div></div>`).join('');
  return `<h2>All lessons <span class="vi">&middot; Tất cả bài học</span></h2>${done}<span class="lab" style="margin-top:8px">Coming up</span>${soon}`;
}
let selP=null,quiz=null,mode='words';
const pl=()=>LESSONS.filter(l=>l.words.length||l.phrases.length);
function wordsBlock(l){
  if(!l.words.length)return '';
  const list=l.words, known=list.filter(w=>store.known[w[0]]).length;
  const cards=list.map(w=>{const im=PHOTOS[w[2]];return `<div class="fc ${im?'':'noimg'} ${store.known[w[0]]?'known':''}" role="button" tabindex="0" data-card="${esc(w[0])}">${im?`<img src="${im}" alt="">`:''}<div class="t"><div class="en">${esc(w[0])}</div><div class="vi">${esc(w[1])}</div></div><button class="spk" data-say="${esc(w[0])}" aria-label="Listen to ${esc(w[0])}">&#128266;</button></div>`}).join('');
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3>Words from this lesson</h3><span class="pill on">${known} of ${list.length} known</span></div>
  <div class="bar"><i style="width:${known/list.length*100}%"></i></div>
  <div class="note">Tap a card to see Vietnamese. Tap &#128266; to hear it. Double tap a card to mark it as known.</div>
  ${list.filter(w=>PHOTOS[w[2]]).length>=4?`<button class="btn" data-quiz="1">&#127919; Photo quiz</button>`:''}</div>
  <div class="grid">${cards}</div>`;
}
function speakBlock(l){
  if(!l.phrases.length)return '';
  const done=l.phrases.filter(p=>store.said[p[0]]).length;
  const ph=l.phrases.map(p=>`<div class="ph"><button class="tick" aria-pressed="${!!store.said[p[0]]}" data-said="${esc(p[0])}" aria-label="I said it">&#10003;</button><div class="tx"><div class="en">${esc(p[0])}</div><div class="vi">${esc(p[1])}</div></div><div class="row" style="flex:none"><button class="btn sm alt" data-say="${esc(p[0])}" aria-label="Listen">&#128266;</button><button class="btn sm alt" data-slow="${esc(p[0])}" aria-label="Listen slowly">&#128034;</button></div></div>`).join('');
  const talk=(l.talk||[]).map(q=>`<div class="ph"><div class="tx"><div class="en">${esc(q)}</div></div><button class="btn sm alt" data-say="${esc(q)}" aria-label="Listen">&#128266;</button></div>`).join('');
  return `<div class="card"><div class="row" style="justify-content:space-between"><h3>Say it in real life</h3><span class="pill on">${done} of ${l.phrases.length}</span></div>
  <div class="note">1. Tap &#128266; and listen. 2. Tap &#128034; for slow. 3. Say it out loud 3 times. 4. Tick it.</div>${ph}</div>
  ${talk?`<div class="card"><h3>Ask a partner</h3><div class="note">Ask each question. Your partner answers with a full sentence.</div>${talk}</div>`:''}`;
}
function quizView(l){
  const pool=l.words.filter(w=>PHOTOS[w[2]]);
  if(pool.length<4){quiz=null;return null}
  if(quiz===true){const q=pool.slice().sort(()=>Math.random()-.5).slice(0,Math.min(8,pool.length));quiz={q,i:0,s:0,a:null,done:false}}
  if(quiz.i>=quiz.q.length){const s=quiz.s,n=quiz.q.length;quiz.done=true;
    return `<div class="card hero"><h2>${s} / ${n}</h2><div>${s===n?'Perfect! Great job.':s>=n/2?'Good work. Try again for a perfect score.':'Keep practising. Try again!'}</div><div class="row"><button class="btn" data-quiz="1">Play again</button><button class="btn alt" data-quiz="0">Back to practice</button></div></div>`}
  const w=quiz.q[quiz.i];
  if(!quiz.opts||quiz.opts.w!==w){const o=[w].concat(pool.filter(x=>x!==w).sort(()=>Math.random()-.5).slice(0,3)).sort(()=>Math.random()-.5);quiz.opts={w,o}}
  const btns=quiz.opts.o.map(o=>{let c='';if(quiz.a){if(o===w)c='ok';else if(o===quiz.a)c='bad'}return `<button class="opt ${c}" data-ans="${esc(o[0])}">${esc(o[0])}</button>`}).join('');
  return `<div class="card"><div class="row" style="justify-content:space-between"><span class="pill">Question ${quiz.i+1} of ${quiz.q.length}</span><button class="btn sm alt" data-quiz="0">Stop</button></div>
  <img class="quizimg" src="${PHOTOS[w[2]]}" alt="">
  <div class="lab">What is it in English?</div><div class="grid" style="grid-template-columns:1fr 1fr">${btns}</div>
  ${quiz.a?`<div class="row" style="justify-content:space-between"><b>${quiz.a===w?'Correct!':'It is: '+esc(w[0])}</b><button class="btn" data-next="1">Next</button></div>`:''}</div>`;
}
function practice(){
  if(!selP)selP=pl().find(x=>x.id===latest.id)?latest.id:pl()[pl().length-1].id;
  const l=LESSONS.find(x=>x.id===selP);
  const chips=pl().slice().reverse().map(x=>`<button class="chip" aria-pressed="${selP===x.id}" data-p="${x.id}">${x.n}. ${esc(x.title)}</button>`).join('');
  const top=`<h2>Practice English <span class="vi">&middot; Luyện tập</span></h2><div class="chips">${chips}</div>
  <div class="card hero"><span class="lab">${fd(l.date)} &middot; ${esc(l.unit)}</span><h3>${title(l)}</h3><div class="row">${slidesBtns(l)}</div></div>
  <div class="seg" role="group" aria-label="Choose practice"><button type="button" data-mode="words" aria-pressed="${mode==='words'}">&#128247; Words</button><button type="button" data-mode="speak" aria-pressed="${mode==='speak'}">&#127908; Speak</button></div>`;
  let body=quiz?quizView(l):null;
  if(body)return top+body;
  return top+(mode==='words'?wordsBlock(l):speakBlock(l));
}
const views={home,lessons,practice};
let lastTab='home';
function route(){
  let h=(location.hash||'#home').slice(1);if(h==='words'||h==='speak')h='practice';const t=views[h]?h:'home';lastTab=t;
  document.querySelectorAll('.tabs a').forEach(a=>{if(a.dataset.t===t)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  render(t);
}
function render(t){t=t||((location.hash||'#home').slice(1));if(t==='words'||t==='speak')t='practice';if(!views[t])t='home';$('#app').innerHTML=views[t]();}
addEventListener('hashchange',()=>{if(location.hash==='#slides')return;if(!$('#viewer').hidden)closeViewer();route();scrollTo(0,0)});
$('#vback').addEventListener('click',()=>{closeViewer();if(location.hash==='#slides'){location.hash=lastTab}});
document.addEventListener('click',e=>{
  const g=a=>e.target.closest('['+a+']');let el;
  if((el=g('data-mode'))&&el.tagName==='BUTTON'){mode=el.dataset.mode;quiz=null;render();return}
  if(el=g('data-slides')){openViewer(el.dataset.slides);return}
  if(el=g('data-say')){e.stopPropagation();say(el.dataset.say);return}
  if(el=g('data-slow')){say(el.dataset.slow,true);return}
  if(el=g('data-said')){const k=el.dataset.said;store.said[k]=!store.said[k];save();render();return}
  if(el=g('data-p')){selP=el.dataset.p;quiz=null;render();return}
  if(el=g('data-quiz')){quiz=el.dataset.quiz==='1'?true:null;render();return}
  if(el=g('data-ans')){if(quiz&&!quiz.a){quiz.a=quiz.q[quiz.i][0]===el.dataset.ans?quiz.q[quiz.i]:quiz.opts.o.find(o=>o[0]===el.dataset.ans);if(quiz.a===quiz.q[quiz.i])quiz.s++;render()}return}
  if(el=g('data-next')){quiz.i++;quiz.a=null;render();return}
  if(el=g('data-card')){el.classList.toggle('flip');return}
  if(el=g('data-set')){selP=el.dataset.set;quiz=null;if(el.dataset.mode)mode=el.dataset.mode}
});
document.addEventListener('dblclick',e=>{const c=e.target.closest('[data-card]');if(!c)return;const k=c.dataset.card;store.known[k]=!store.known[k];save();render()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const c=e.target.closest&&e.target.closest('[data-card]');if(c&&e.target===c)c.classList.toggle('flip')}});
const nav=$('.tabs');
function fixNav(){const v=window.visualViewport;if(!v||!nav)return;if(innerWidth>=720){nav.style.transform='';return}const s=v.scale;nav.style.transform=s<1.01?'':`translate(${v.offsetLeft}px,${v.offsetTop+v.height-document.documentElement.clientHeight}px) scale(${1/s})`}
try{visualViewport.addEventListener('resize',fixNav);visualViewport.addEventListener('scroll',fixNav)}catch(e){}
addEventListener('scroll',fixNav,{passive:true});addEventListener('touchmove',fixNav,{passive:true});addEventListener('touchend',()=>{fixNav();setTimeout(fixNav,150);setTimeout(fixNav,500)},{passive:true});
(function loop(){fixNav();requestAnimationFrame(loop)})();
route();
</script>

</body></html>
